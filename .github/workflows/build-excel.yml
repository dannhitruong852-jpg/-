name: Build Excel download

on:
  push:
    branches: [main]
    paths:
      - ".chatgpt_excel_source.json"
      - ".chatgpt_excel_builder.py"
      - ".github/workflows/build-excel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade openpyxl
      - name: Build workbook
        run: python .chatgpt_excel_builder.py
      - name: Commit workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "2021-2026浙大MAP单选考点定位.xlsx"
          if git diff --cached --quiet; then
            echo "No workbook changes"
          else
            git commit -m "Add 2021-2026浙大MAP单选考点定位.xlsx"
            git push
          fi
